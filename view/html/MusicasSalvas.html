<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists Salvas - NectarNotes</title>
    <link rel="shortcut icon" type="image/png" href="../../pictures/others/logo.png">
    <link rel="stylesheet" href="../css/MusicasSalvas.css">
    <script src="../js/script.js"></script>
    <style>
        .playlist-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 24px;
            margin-left: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-new-playlist {
            background-color: #ffd800;
            color: #131722;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-new-playlist:hover {
            background-color: #ffea00;
        }
        .close-btn {
            background-color: #dd3630;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .panel-song-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #252b3d;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .panel-song-row:hover {
            background-color: #323952;
        }
    </style>
</head>
<body>
    <div class="menu">
        <ul>
            <li><a href="principal.html" onclick="handleButtonClick('inicio')"><img src="../../pictures/icons/main.png" alt="Botão de Início"></a></li>
            <li><a href="TelaPesquisa.html" onclick="handleButtonClick('party')"><img src="../../pictures/icons/party.png" alt="Botão de Party"></a></li>
            <li><a href="MusicasSalvas.html" onclick="handleButtonClick('album')"><img src="../../pictures/icons/liked.png" alt="Botão de Album"></a></li>
            <li><a href="TelaPets.html" onclick="handleButtonClick('pets')"><img src="../../pictures/icons/Pets.png" alt="Botão de Pets"></a></li>
            <li class="menu-separator"></li>
            <div class="menu-profile-config">
                <li><a href="TelaPerfil.html" onclick="handleButtonClick('perfil')"><img src="../../pictures/icons/profile.png" alt="Botão de Perfil"></a></li>
                <li><a href="TelaConfig.html" onclick="handleButtonClick('configuracoes')"><img src="../../pictures/icons/config.png" alt="Botão de Configurações"></a></li>
            </div>
        </ul>
    </div>

    <div class="content">
        <header class="header">
            <h1>Playlists Salvas</h1>
            <button class="btn-new-playlist" onclick="createNewPlaylist()">+ Nova Playlist</button>
        </header>

        <div class="playlist-container" id="playlistContainer"></div>

        <div class="overlay" onclick="closePanel()"></div>

        <div id="slide-panel" class="side-panel">
            <button onclick="closePanel()" class="close-btn">✕ Fechar</button>
            <div id="playlist-info" class="playlist-info">
                <h2 id="playlist-title" style="color: #ffd800; margin-top: 0;">Título da Playlist</h2>
                <p id="playlist-desc" style="color: #aaa; font-size: 14px; margin-top: -8px;"></p>
                <div id="playlist-cover" class="playlist-cover"></div>
                <div id="playlist-music-list" class="music-list"></div>
            </div>
        </div>
    </div>

    <script>
        let loadedPlaylists = [];

        const FALLBACK_PLAYLISTS = [
            {
                id: 1,
                name: 'Favoritas da Colmeia',
                description: 'As mais tocadas na colmeia',
                songs: DEFAULT_SONGS_FALLBACK.slice(0, 6)
            },
            {
                id: 2,
                name: 'Vibe Néctar & Lo-Fi',
                description: 'Para relaxar e estudar',
                songs: DEFAULT_SONGS_FALLBACK.slice(4, 10)
            },
            {
                id: 3,
                name: 'Zumbido Eletrônico',
                description: 'Energia máxima para a festa',
                songs: DEFAULT_SONGS_FALLBACK.slice(8, 14)
            }
        ];

        async function loadPlaylists() {
            const userId = NectarAPI.getCurrentUserId();
            try {
                const res = await fetch(`/api/playlists?userId=${userId}`);
                if (res.ok) {
                    const data = await res.json();
                    loadedPlaylists = data.map(p => ({
                        ...p,
                        songs: (p.songs || []).map(s => ({
                            ...s,
                            cover_url: resolveAssetUrl(s.cover_url),
                            audio_url: resolveAssetUrl(s.audio_url)
                        }))
                    }));
                } else {
                    loadedPlaylists = FALLBACK_PLAYLISTS;
                }
            } catch (_) {
                loadedPlaylists = FALLBACK_PLAYLISTS;
            }
            renderPlaylists();
        }

        function renderPlaylists() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';

            loadedPlaylists.forEach(playlist => {
                const card = document.createElement('div');
                card.className = 'playlist-item';
                card.dataset.playlistId = playlist.id;

                const covers = (playlist.songs || []).slice(0, 4);
                while (covers.length < 4) {
                    covers.push({ cover_url: '../../pictures/Capas/Capa01.webp', title: 'Capa' });
                }

                card.innerHTML = `
                    <div class="music-covers">
                        ${covers.map(s => `<img src="${s.cover_url}" alt="${s.title}" class="music-cover">`).join('')}
                    </div>
                    <p class="playlist-title">${playlist.name}</p>
                `;

                card.addEventListener('click', () => openPanel(playlist.id));
                container.appendChild(card);
            });
        }

        function openPanel(playlistId) {
            const playlist = loadedPlaylists.find(p => String(p.id) === String(playlistId));
            if (!playlist) return;

            const panel = document.getElementById('slide-panel');
            const overlay = document.querySelector('.overlay');
            const titleEl = document.getElementById('playlist-title');
            const descEl = document.getElementById('playlist-desc');
            const coverGrid = document.getElementById('playlist-cover');
            const musicList = document.getElementById('playlist-music-list');

            titleEl.textContent = playlist.name;
            descEl.textContent = playlist.description || `${playlist.songs.length} músicas na playlist`;

            const firstFour = (playlist.songs || []).slice(0, 4);
            coverGrid.innerHTML = firstFour.map(s => `<img src="${s.cover_url}" alt="${s.title}">`).join('');

            musicList.innerHTML = '';
            (playlist.songs || []).forEach(song => {
                const row = document.createElement('div');
                row.className = 'panel-song-row';
                row.innerHTML = `
                    <img src="${song.cover_url}" alt="${song.title}" style="width: 55px; height: 55px; border-radius: 6px; object-fit: cover;">
                    <div style="flex: 1;">
                        <div style="font-weight: bold; color: #fff;">${song.title}</div>
                        <div style="font-size: 12px; color: #bbb;">${song.artist} • ${song.duration || '3:45'}</div>
                    </div>
                    <span style="color: #ffd800; font-size: 18px;">▶</span>
                `;
                row.addEventListener('click', () => {
                    window.location.href = `telademusica.html?id=${song.id}`;
                });
                musicList.appendChild(row);
            });

            panel.classList.add('show');
            overlay.classList.add('show');
        }

        function closePanel() {
            document.getElementById('slide-panel').classList.remove('show');
            document.querySelector('.overlay').classList.remove('show');
        }

        async function createNewPlaylist() {
            const name = prompt('Digite o nome da nova Playlist:');
            if (!name || !name.trim()) return;
            const description = prompt('Descrição da Playlist (opcional):') || '';

            try {
                const res = await fetch('/api/playlists', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: NectarAPI.getCurrentUserId(),
                        name: name.trim(),
                        description,
                        songIds: [1, 3, 5, 7, 9]
                    })
                });
                if (res.ok) {
                    await loadPlaylists();
                    return;
                }
            } catch (_) {}

            loadedPlaylists.push({
                id: Date.now(),
                name: name.trim(),
                description,
                songs: DEFAULT_SONGS_FALLBACK.slice(0, 5)
            });
            renderPlaylists();
        }

        document.addEventListener('DOMContentLoaded', loadPlaylists);
    </script>
</body>
</html>
