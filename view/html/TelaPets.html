<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="shortcut icon" type="image/png" href="../../pictures/others/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/Pets.css">
    <script src="../js/script.js"></script>
    <title>Pets - NectarNotes</title>
    <style>
        .song {
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 3px solid transparent;
        }
        .song:hover {
            transform: scale(1.06);
        }
        .song.equipped {
            border-color: #0d0d17;
            box-shadow: 0 0 15px rgba(13, 13, 23, 0.8);
        }
        .pet-equipped-badge {
            background-color: #0d0d17;
            color: #ffd800;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            width: 216px;
            box-sizing: border-box;
        }
        .btn-rename-pet {
            background-color: #0d0d17;
            color: #ffd800;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
            width: fit-content;
        }
    </style>
</head>

<body>
    <div class="menu">
        <ul>
            <li><a href="principal.html" onclick="handleButtonClick('inicio')"><img src="../../pictures/icons/main.png" alt="Botão de Início"></a></li>
            <li><a href="TelaPesquisa.html" onclick="handleButtonClick('party')"><img src="../../pictures/icons/party.png" alt="Botão de Party"></a></li>
            <li><a href="MusicasSalvas.html" onclick="handleButtonClick('album')"><img src="../../pictures/icons/liked.png" alt="Botão de Album"></a></li>
            <li><a href="TelaPets.html" onclick="handleButtonClick('pets')"><img src="../../pictures/icons/Pets.png" alt="Botão de Pets"></a></li>
            <li class="menu-separator"></li>
            <div class="menu-profile-config">
                <li><a href="TelaPerfil.html" onclick="handleButtonClick('perfil')"><img src="../../pictures/icons/profile.png" alt="Botão de Perfil"></a></li>
                <li><a href="TelaConfig.html" onclick="handleButtonClick('configuracoes')"><img src="../../pictures/icons/config.png" alt="Botão de Configurações"></a></li>
            </div>
        </ul>
    </div>

    <div class="MeuPet" style="color: #0d0d17;">
        <h1 id="petNameDisplay">Buzzy Mel</h1>
        <button class="btn-rename-pet" onclick="renamePet()">✏️ Renomear Pet</button>
        <div class="xpBar">
            <div class="xpProgress" id="xpProgressBar"><p id="xpNivel">XP: 55 (Nível 2)</p></div>
        </div>
        <img id="ImgPet" src="../../pictures/FotosPets/FotoPet01.jpg" alt="Imagem Pet" style="border-radius: 16px; object-fit: cover;">
        <div class="pet-equipped-badge" id="equippedStatus">
            <div>👕 Camisa: <span id="eqShirtName">Nenhuma</span></div>
            <div style="margin-top: 4px;">🕶️ Rosto: <span id="eqFaceName">Nenhum</span></div>
        </div>
    </div>

    <div class="scrollable-container" id="container1" style="color: #0d0d17;">
        <div class="nomeCatalago">
            <h1>Camisas (Clique para equipar e ganhar XP)</h1>
        </div>
        <div id="shirtsContainer"></div>

        <div class="nomeCatalago">
            <h1>Rosto e Acessórios</h1>
        </div>
        <div id="facesContainer"></div>
    </div>

    <script>
        const DEFAULT_ITEMS = [
            { id: 1, name: 'Camiseta Azul', category: 'camisa', image_url: 'https://img.freepik.com/vetores-gratis/desenho-de-adesivo-com-camiseta-azul-isolada_1308-79625.jpg' },
            { id: 2, name: 'Camiseta Vermelha', category: 'camisa', image_url: 'https://static.vecteezy.com/system/resources/previews/003/532/204/non_2x/sticker-design-with-red-t-shirt-isolated-free-vector.jpg' },
            { id: 3, name: 'Camiseta Branca', category: 'camisa', image_url: 'https://static.vecteezy.com/system/resources/thumbnails/006/034/398/small_2x/sticker-white-t-shirt-with-coathanger-free-vector.jpg' },
            { id: 4, name: 'Moletom Colmeia', category: 'camisa', image_url: 'https://th.bing.com/th/id/OIP.UL742fzpgA2pX35cdY-MgAHaHa?rs=1&pid=ImgDetMain' },
            { id: 5, name: 'Jaqueta Dourada', category: 'camisa', image_url: 'https://th.bing.com/th/id/OIP.WlR4JaP6HPBjIfmq0pQ9LwHaGG?rs=1&pid=ImgDetMain' },
            { id: 6, name: 'Camisa Vasco', category: 'camisa', image_url: 'https://static.shopvasco.com.br/produtos/camiseta-infantil-vasco-da-gama-recorte/06/425-8912-006/425-8912-006_zoom1.jpg?ts=1581420023&ims=1088x' },
            { id: 7, name: 'Manto Real', category: 'camisa', image_url: 'https://thumbs.dreamstime.com/z/composi%C3%A7%C3%A3o-realista-do-rei-cloak-manto-com-imagem-vestido-monarca-o-cetro-vermelho-real-e-ilustra%C3%A7%C3%A3o-vetor-de-bola-200482946.jpg' },
            { id: 8, name: 'Óculos Escuros', category: 'rosto', image_url: 'https://prints.ultracoloringpages.com/b052c464fc36c37388dfbe6082288d3d.png' },
            { id: 9, name: 'Óculos Cool', category: 'rosto', image_url: 'https://th.bing.com/th/id/OIP.ylbodItlJPFQym6zWriM7QHaHa?rs=1&pid=ImgDetMain' },
            { id: 10, name: 'Coroa de Abelha', category: 'rosto', image_url: 'https://th.bing.com/th/id/OIP.NT-IKq8OjQHsY5cWkk9o-AHaHa?rs=1&pid=ImgDetMain' }
        ];

        let currentPet = { name: 'Buzzy Mel', xp: 55, level: 2, equipped_shirt_id: null, equipped_face_id: null };
        let petItems = DEFAULT_ITEMS;

        async function loadPetData() {
            const userId = NectarAPI.getCurrentUserId();
            try {
                const res = await fetch(`/api/pets/${userId}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.pet) currentPet = data.pet;
                    if (data.items && data.items.length) petItems = data.items;
                }
            } catch (_) {}
            renderPetUI();
        }

        function renderPetUI() {
            document.getElementById('petNameDisplay').textContent = currentPet.name || 'Buzzy Mel';
            const xp = currentPet.xp || 55;
            const level = currentPet.level || (Math.floor(xp / 50) + 1);
            document.getElementById('xpNivel').textContent = `XP: ${xp} (Nível ${level})`;

            const progressInLevel = ((xp % 50) / 50) * 216;
            document.getElementById('xpProgressBar').style.width = `${Math.max(60, Math.min(216, progressInLevel))}px`;

            const shirtObj = petItems.find(i => i.id === currentPet.equipped_shirt_id);
            const faceObj = petItems.find(i => i.id === currentPet.equipped_face_id);
            document.getElementById('eqShirtName').textContent = shirtObj ? shirtObj.name : 'Nenhuma';
            document.getElementById('eqFaceName').textContent = faceObj ? faceObj.name : 'Nenhum';

            const shirtsContainer = document.getElementById('shirtsContainer');
            const facesContainer = document.getElementById('facesContainer');
            shirtsContainer.innerHTML = '';
            facesContainer.innerHTML = '';

            petItems.forEach(item => {
                const div = document.createElement('div');
                const isEquipped = item.id === currentPet.equipped_shirt_id || item.id === currentPet.equipped_face_id;
                div.className = 'song' + (isEquipped ? ' equipped' : '');
                div.title = `${item.name} (Clique para equipar)`;
                div.innerHTML = `<img src="${item.image_url}" alt="${item.name}">`;
                div.addEventListener('click', () => equipItem(item));

                if (item.category === 'camisa') {
                    shirtsContainer.appendChild(div);
                } else {
                    facesContainer.appendChild(div);
                }
            });
        }

        async function equipItem(item) {
            const userId = NectarAPI.getCurrentUserId();
            try {
                const res = await fetch(`/api/pets/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemId: item.id })
                });
                if (res.ok) {
                    const data = await res.json();
                    currentPet = data.pet;
                    renderPetUI();
                    return;
                }
            } catch (_) {}

            if (item.category === 'camisa') {
                currentPet.equipped_shirt_id = currentPet.equipped_shirt_id === item.id ? null : item.id;
            } else {
                currentPet.equipped_face_id = currentPet.equipped_face_id === item.id ? null : item.id;
            }
            currentPet.xp = (currentPet.xp || 55) + 15;
            currentPet.level = Math.floor(currentPet.xp / 50) + 1;
            renderPetUI();
        }

        async function renamePet() {
            const newName = prompt('Digite o novo nome do seu Pet:', currentPet.name);
            if (!newName || !newName.trim()) return;
            const userId = NectarAPI.getCurrentUserId();
            try {
                const res = await fetch(`/api/pets/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName.trim() })
                });
                if (res.ok) {
                    const data = await res.json();
                    currentPet = data.pet;
                    renderPetUI();
                    return;
                }
            } catch (_) {}
            currentPet.name = newName.trim();
            renderPetUI();
        }

        document.addEventListener('DOMContentLoaded', loadPetData);
    </script>
</body>

</html>
