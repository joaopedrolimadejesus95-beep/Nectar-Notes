<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Ouvinte - NectarNotes</title>
    <link rel="shortcut icon" type="image/png" href="../../pictures/others/logo.png">
    <link rel="stylesheet" href="../css/Perfil.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <script src="../js/script.js"></script>
    <style>
        body {
            background-color: #0b0d14 !important;
        }
        .content {
            margin-left: 104px !important;
            width: calc(100% - 124px) !important;
            padding: 24px !important;
        }
        .banner {
            height: 230px;
            border-radius: 24px;
            border: 1px solid rgba(255, 216, 0, 0.3);
            box-shadow: 0 18px 40px rgba(0,0,0,0.45);
        }
        .profile-picture {
            width: 132px;
            height: 132px;
            border: 4px solid #ffd800;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
        }
        .tabs {
            background: rgba(20, 24, 41, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }
        .tab.active {
            background: linear-gradient(135deg, #ffd800, #ff9d00);
            color: #0b0d14;
            font-weight: 800;
        }
        .info {
            background: rgba(20, 24, 41, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <ul>
            <li><a href="principal.html" onclick="handleButtonClick('inicio')"><img src="../../pictures/icons/main.png" alt="Início"></a></li>
            <li><a href="TelaPesquisa.html" onclick="handleButtonClick('party')"><img src="../../pictures/icons/party.png" alt="Explorar"></a></li>
            <li><a href="MusicasSalvas.html" onclick="handleButtonClick('album')"><img src="../../pictures/icons/liked.png" alt="Playlists"></a></li>
            <li><a href="TelaPets.html" onclick="handleButtonClick('pets')"><img src="../../pictures/icons/Pets.png" alt="Mascote"></a></li>
            <li class="menu-separator"></li>
            <div class="menu-profile-config">
                <li><a href="TelaPerfil.html" onclick="handleButtonClick('perfil')"><img src="../../pictures/icons/profile.png" alt="Perfil"></a></li>
                <li><a href="TelaConfig.html" onclick="handleButtonClick('configuracoes')"><img src="../../pictures/icons/config.png" alt="Configurações"></a></li>
            </div>
        </ul>
    </div>

    <div class="content">
        <div class="banner" id="profileBanner" style="background-image: url('../../pictures/others/honeyWaterfall.png'); background-size: cover; background-position: center;">
            <a href="TelaConfig.html" title="Editar Perfil">
                <img src="../../pictures/icons/camera.png" alt="Editar" class="banner-button">
            </a>
        </div>

        <div class="profile-container" style="justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <div style="display: flex; align-items: center;">
                <div class="profile-picture-container">
                    <img id="profilePicture" src="../../pictures/icons/profile.png" alt="Foto de Perfil" class="profile-picture" onclick="window.location.href='TelaConfig.html'">
                </div>
                <div class="profile-info">
                    <div class="username" id="profileUsername">AbelhaRainha</div>
                    <div class="bio" id="profileBio" style="font-size: 15px; color: #cbd5e1;">Apoiando e divulgando os melhores artistas indies da nossa colmeia.</div>
                    <div class="country" id="profileCountry" style="font-size: 13px; color: #ffd800;">Brasil • Ouvinte Polinizador</div>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" onclick="openIndieSubmitModal()" style="background: linear-gradient(135deg, #ffd800, #ff9d00); color: #0b0d14; border: none; padding: 10px 18px; border-radius: 999px; font-weight: 800; cursor: pointer;">
                    + Divulgar Música Indie
                </button>
                <a href="TelaConfig.html" style="background: rgba(255,255,255,0.08); color: #fff; padding: 10px 18px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 13px;">Editar Perfil</a>
            </div>
        </div>

        <div class="tabs" style="margin-top: 25px;">
            <div class="tab active" id="tabLiked" onclick="switchTab('liked')">Músicas Favoritas</div>
            <div class="tab" id="tabPlaylists" onclick="switchTab('playlists')">Minhas Playlists</div>
            <div class="tab" id="tabPet" onclick="switchTab('pet')">Meu Mascote</div>
        </div>

        <div class="info" id="profileContentArea" style="justify-content: flex-start;"></div>
    </div>

    <script>
        let userProfileData = {
            user: {
                username: localStorage.getItem('username') || 'AbelhaRainha',
                bio: localStorage.getItem('bio') || 'Apoiando e divulgando os melhores artistas indies da nossa colmeia.',
                country: localStorage.getItem('country') || 'Brasil',
                profile_pic: localStorage.getItem('profilePic') || '../../pictures/icons/profile.png'
            },
            likedSongs: DEFAULT_SONGS_FALLBACK.slice(0, 5),
            pet: { name: 'Buzzy Mel', xp: 55, level: 2, photo_url: '../../pictures/FotosPets/FotoPet01.jpg' }
        };

        async function loadUserProfile() {
            const userId = NectarAPI.getCurrentUserId();
            try {
                const res = await fetch(`/api/users/${userId}`);
                if (res.ok) {
                    const data = await res.json();
                    userProfileData = {
                        user: {
                            ...data.user,
                            profile_pic: localStorage.getItem('profilePic') || resolveAssetUrl(data.user.profile_pic)
                        },
                        likedSongs: (data.likedSongs || []).map(s => ({
                            ...s,
                            cover_url: resolveAssetUrl(s.cover_url)
                        })),
                        pet: data.pet ? {
                            ...data.pet,
                            photo_url: resolveAssetUrl(data.pet.photo_url)
                        } : userProfileData.pet
                    };
                }
            } catch (_) {}

            document.getElementById('profileUsername').textContent = userProfileData.user.username;
            document.getElementById('profileBio').textContent = (userProfileData.user.bio || '').replace(/[\u{1F300}-\u{1FAFF}]/gu, '').trim();
            document.getElementById('profileCountry').textContent = (userProfileData.user.country || 'Brasil') + ' • Ouvinte Polinizador';
            document.getElementById('profilePicture').src = userProfileData.user.profile_pic;

            switchTab('liked');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const area = document.getElementById('profileContentArea');
            area.innerHTML = '';

            if (tabName === 'liked') {
                document.getElementById('tabLiked').classList.add('active');
                const songs = userProfileData.likedSongs || [];
                if (songs.length === 0) {
                    area.innerHTML = '<p style="color: #aaa;">Nenhuma música curtida ainda. Clique em uma música para adicioná-la à colmeia.</p>';
                    return;
                }
                songs.forEach(song => {
                    const card = document.createElement('div');
                    card.className = 'CardMusic';
                    card.dataset.songId = song.id;
                    card.style.marginRight = '0';
                    card.innerHTML = `
                        <div class="CardImage">
                            <span class="card-genre-pill">${song.genre || 'Indie'}</span>
                            <img class="CapaMusica" src="${song.cover_url}" alt="${song.title}">
                            <div class="card-play-fab">
                                <svg class="ui-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>
                        <div class="CardContent">
                            <div class="NomeMusica"><b>${song.title}</b></div>
                            <div class="NomeArtista">${song.artist}</div>
                            <div class="card-footer-row">
                                <span class="card-plays-count">Favorita</span>
                                <a class="btn-open-song" href="telademusica.html?id=${song.id}">Ver artista</a>
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', (e) => playMusic(card, e));
                    area.appendChild(card);
                });
            } else if (tabName === 'playlists') {
                document.getElementById('tabPlaylists').classList.add('active');
                area.innerHTML = `
                    <div style="padding: 15px;">
                        <p style="color: #cbd5e1;">Acesse e gerencie todas as suas playlists indies salvas na Colmeia:</p>
                        <a href="MusicasSalvas.html" style="display: inline-block; background: linear-gradient(135deg, #ffd800, #ff9d00); color: #000; padding: 12px 24px; border-radius: 999px; text-decoration: none; font-weight: 800;">Abrir Playlists Salvas</a>
                    </div>
                `;
            } else if (tabName === 'pet') {
                document.getElementById('tabPet').classList.add('active');
                const pet = userProfileData.pet;
                area.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 20px; padding: 10px;">
                        <img src="${pet.photo_url}" alt="${pet.name}" style="width: 120px; height: 120px; border-radius: 16px; object-fit: cover; border: 2px solid #ffd800;">
                        <div>
                            <h3 style="margin: 0 0 8px 0; color: #ffd800;">${pet.name}</h3>
                            <p style="margin: 4px 0; color: #cbd5e1;">Nível: <b>${pet.level}</b> (${pet.xp} XP)</p>
                            <a href="TelaPets.html" style="display: inline-block; margin-top: 8px; background: linear-gradient(135deg, #ffd800, #ff9d00); color: #000; padding: 10px 18px; border-radius: 999px; text-decoration: none; font-weight: 800;">Personalizar Mascote</a>
                        </div>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadUserProfile);
    </script>
</body>
</html>
