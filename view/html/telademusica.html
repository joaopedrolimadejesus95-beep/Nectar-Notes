<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Indie & Player - NectarNotes</title>
    <link rel="shortcut icon" type="image/png" href="../../pictures/others/logo.png">
    <link rel="stylesheet" href="../css/telademusica.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <script src="../js/script.js"></script>
    <style>
        body {
            background-color: #0b0d14;
            padding-bottom: 20px !important;
        }
        .container {
            margin-left: 96px;
            width: calc(100% - 116px);
            min-height: 94vh;
            height: auto;
            gap: 20px;
            padding: 16px;
        }
        .left-side {
            width: 52%;
            border-right: none;
            height: auto;
        }
        .right-side {
            width: 48%;
            height: auto;
            padding: 12px;
        }
        .album {
            background: rgba(20, 24, 41, 0.82);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 216, 0, 0.18);
            border-radius: 22px;
            padding: 18px;
            max-height: 75vh;
        }
        .song {
            background: rgba(13, 16, 29, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .song:hover {
            transform: translateX(4px);
            border-color: rgba(255, 216, 0, 0.4);
            background: rgba(26, 31, 52, 0.9);
        }
        .song.active-track {
            border: 2px solid #ffd800;
            box-shadow: 0 0 18px rgba(255, 216, 0, 0.2);
        }
        .album-art {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 16px;
        }
        .play-badge-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 216, 0, 0.14);
            color: #ffd800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        @media (max-width: 960px) {
            .container {
                flex-direction: column;
            }
            .left-side, .right-side {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="menu">
        <ul>
            <li><a href="principal.html" title="Início" onclick="handleButtonClick('inicio')"><img src="../../pictures/icons/main.png" alt="Início"></a></li>
            <li><a href="TelaPesquisa.html" title="Explorar Cena Indie" onclick="handleButtonClick('party')"><img src="../../pictures/icons/party.png" alt="Explorar"></a></li>
            <li><a href="MusicasSalvas.html" title="Playlists Salvas" onclick="handleButtonClick('album')"><img src="../../pictures/icons/liked.png" alt="Playlists"></a></li>
            <li><a href="TelaPets.html" title="Mascote" onclick="handleButtonClick('pets')"><img src="../../pictures/icons/Pets.png" alt="Mascote"></a></li>
            <li class="menu-separator"></li>
            <div class="menu-profile-config">
                <li><a href="TelaPerfil.html" title="Perfil" onclick="handleButtonClick('perfil')"><img src="../../pictures/icons/profile.png" alt="Perfil"></a></li>
                <li><a href="TelaConfig.html" title="Configurações" onclick="handleButtonClick('configuracoes')"><img src="../../pictures/icons/config.png" alt="Configurações"></a></li>
            </div>
        </ul>
    </div>

    <div class="container">
        <div class="left-side">
            <iframe id="playerIframe" src="iframedatelademusica.html?id=1" style="width: 100%; height: 760px; border: none;"></iframe>
        </div>
        <div class="right-side">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h1 style="color: #f8fafc; margin: 0; font-size: 21px; font-weight: 800;">Fila da Cena Indie</h1>
                <button type="button" onclick="openIndieSubmitModal()" style="background: linear-gradient(135deg, #ffd800, #ff9d00); color: #0b0d14; border: none; padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 12px; cursor: pointer;">
                    + Divulgar Minha Banda
                </button>
            </div>
            <div class="album" id="albumSongList"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const currentId = Number(params.get('id') || 1);
            const iframe = document.getElementById('playerIframe');
            iframe.src = `iframedatelademusica.html?id=${currentId}`;

            const songs = await NectarAPI.getSongs();
            const listEl = document.getElementById('albumSongList');
            listEl.innerHTML = '';

            songs.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song' + (song.id === currentId ? ' active-track' : '');
                item.innerHTML = `
                    <img src="${song.cover_url}" alt="${song.title}" class="album-art">
                    <div style="flex: 1;">
                        <h2 style="font-size: 15px; margin: 0 0 4px 0; color: #fff;">${song.title}</h2>
                        <p style="color: #ffd800; font-size: 13px; margin: 0 0 3px 0; font-weight: 600;">${song.artist}</p>
                        <span style="color: #94a3b8; font-size: 12px;">${song.artist_city || 'Brasil'} • ${song.genre} • ${song.plays || 100} plays</span>
                    </div>
                    <span class="play-badge-circle">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </span>
                `;
                item.addEventListener('click', () => {
                    iframe.src = `iframedatelademusica.html?id=${song.id}`;
                    document.querySelectorAll('#albumSongList .song').forEach(el => el.classList.remove('active-track'));
                    item.classList.add('active-track');
                    history.replaceState(null, '', `?id=${song.id}`);
                });
                listEl.appendChild(item);
            });
        });
    </script>
</body>
</html>
