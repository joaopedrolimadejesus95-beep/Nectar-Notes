<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados da Busca Indie - NectarNotes</title>
    <link rel="stylesheet" href="../css/resultado.css">
    <link rel="stylesheet" href="../css/design-system.css">
    <script src="../js/script.js" defer></script>
    <link rel="icon" href="../../pictures/others/logo.png" type="image/png">
    <style>
        body {
            background-color: #0b0d14 !important;
        }
        main {
            height: auto;
            min-height: 85vh;
            padding-top: 90px;
            padding-left: 116px;
            padding-right: 32px;
            align-items: flex-start;
            background-color: #0b0d14 !important;
        }
        .results-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
            margin-top: 24px;
        }
        .clear-icon {
            position: absolute;
            right: 14px;
            color: #ffd800;
            cursor: pointer;
            display: none;
            font-weight: bold;
        }
        .filter-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .chip-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip-btn:hover, .chip-btn.active {
            background: linear-gradient(135deg, #ffd800, #ff9d00);
            color: #0b0d14;
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div class="group" style="top: 24px; right: 32px;">
        <img id="LupaPesquisa" src="../../pictures/icons/search.png" alt="Lupa" class="icon" style="width: 18px; height: 18px; top: 12px; left: 14px;">
        <input id="searchInput" class="input" type="search" placeholder="Filtrar por artista, faixa, gênero ou cidade..." style="border-radius: 999px; border: 1px solid rgba(255, 216, 0, 0.35); padding-left: 42px;" />
        <span class="clear-icon" id="clearIcon">✕</span>
    </div>

    <div class="menu">
        <ul>
            <li><a href="principal.html" onclick="handleButtonClick('inicio')"><img src="../../pictures/icons/main.png" alt="Botão de Início"></a></li>
            <li><a href="TelaPesquisa.html" onclick="handleButtonClick('party')"><img src="../../pictures/icons/party.png" alt="Botão de Party"></a></li>
            <li><a href="MusicasSalvas.html" onclick="handleButtonClick('album')"><img src="../../pictures/icons/liked.png" alt="Botão de Album"></a></li>
            <li><a href="TelaPets.html" onclick="handleButtonClick('pets')"><img src="../../pictures/icons/Pets.png" alt="Botão de Pets"></a></li>
            <li><button type="button" class="btn-nav-indie" title="Divulgar Artista Indie" onclick="openIndieSubmitModal()">+</button></li>
            <li class="menu-separator"></li>
            <div class="menu-profile-config">
                <li><a href="TelaPerfil.html" onclick="handleButtonClick('perfil')"><img src="../../pictures/icons/profile.png" alt="Botão de Perfil"></a></li>
                <li><a href="TelaConfig.html" onclick="handleButtonClick('configuracoes')"><img src="../../pictures/icons/config.png" alt="Botão de Configurações"></a></li>
            </div>
        </ul>
    </div>

    <main>
        <div class="container" style="width: 100%; text-align: left;">
            <h1 class="temp" id="resultsCount" style="margin: 0; font-size: 28px;">Buscando...</h1>
            <div class="filter-chips">
                <button class="chip-btn active" onclick="setQuickFilter('', this)">Todos</button>
                <button class="chip-btn" onclick="setQuickFilter('Indie Rock', this)">Indie Rock</button>
                <button class="chip-btn" onclick="setQuickFilter('Bedroom', this)">Bedroom Pop</button>
                <button class="chip-btn" onclick="setQuickFilter('Lo-Fi', this)">Lo-Fi</button>
                <button class="chip-btn" onclick="setQuickFilter('MPB', this)">MPB / Folk</button>
                <button class="chip-btn" onclick="setQuickFilter('São Paulo', this)">📍 São Paulo</button>
                <button class="chip-btn" onclick="setQuickFilter('Curitiba', this)">📍 Curitiba</button>
            </div>
            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </main>

    <script>
        async function performSearch(queryText) {
            const songs = await NectarAPI.getSongs(queryText ? { search: queryText } : {});
            const countEl = document.getElementById('resultsCount');
            const grid = document.getElementById('resultsGrid');

            countEl.textContent = `${songs.length} Artista(s) / Faixa(s) encontrada(s)${queryText ? ` para "${queryText}"` : ' na Colmeia'}`;
            grid.innerHTML = '';

            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'CardMusic';
                card.dataset.songId = song.id;
                card.style.marginRight = '0';
                card.innerHTML = `
                    <div class="CardImage">
                        <span class="card-genre-pill">${song.genre || 'Indie'}</span>
                        <img class="CapaMusica" src="${song.cover_url}" alt="${song.title}">
                        <div class="card-play-fab">▶</div>
                    </div>
                    <div class="CardContent">
                        <div class="NomeMusica"><b>${song.title}</b></div>
                        <div class="NomeArtista">${song.artist}</div>
                        <div class="card-footer-row">
                            <span class="card-plays-count">📍 ${song.artist_city || 'Brasil'}</span>
                            <a class="btn-open-song" href="telademusica.html?id=${song.id}">Artista →</a>
                        </div>
                    </div>
                `;
                card.addEventListener('click', (e) => playMusic(card, e));
                grid.appendChild(card);
            });
        }

        function setQuickFilter(term, btn) {
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const searchInput = document.getElementById('searchInput');
            searchInput.value = term;
            performSearch(term);
        }

        document.addEventListener('DOMContentLoaded', function () {
            const searchInput = document.getElementById('searchInput');
            const clearIcon = document.getElementById('clearIcon');
            const params = new URLSearchParams(window.location.search);
            const initialQuery = params.get('q') || '';

            searchInput.value = initialQuery;
            if (clearIcon) {
                clearIcon.style.display = initialQuery ? 'block' : 'none';
            }

            performSearch(initialQuery);

            searchInput.addEventListener('input', function () {
                if (clearIcon) {
                    clearIcon.style.display = searchInput.value ? 'block' : 'none';
                }
                performSearch(searchInput.value.trim());
            });

            if (clearIcon) {
                clearIcon.addEventListener('click', function () {
                    searchInput.value = '';
                    clearIcon.style.display = 'none';
                    searchInput.focus();
                    performSearch('');
                });
            }
        });
    </script>
</body>
</html>
