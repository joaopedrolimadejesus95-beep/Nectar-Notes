<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="shortcut icon" type="image/png" href="pictures/others/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="view/css/TelaLogin.css">
    <title>Login - NectarNotes</title>
</head>

<body>
    <div class="login-container">
        <img src="pictures/others/logo.png" alt="Logo NectarNotes" style="width: 90px; height: auto; margin-bottom: 10px;">
        <h1>Login</h1>
        <p id="loginError" style="color: #d93025; font-size: 14px; display: none; margin-bottom: 12px;"></p>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuário ou Email (ex: AbelhaRainha)" required><br>
            <input type="password" id="password" placeholder="Senha (ex: 123456)" required><br>
            <button type="submit" id="Login">Entrar</button>
        </form>
        <div class="signup">Não tem uma conta? <a href="view/html/TelaCadastro.html">Cadastre-se</a></div>
    </div>

    <script src="view/js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('loginError');
            errorBox.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    NectarAPI.saveUserSession(data.user);
                    window.location.href = 'view/html/principal.html';
                    return;
                } else {
                    const errData = await response.json();
                    errorBox.textContent = errData.error || 'Erro ao fazer login.';
                    errorBox.style.display = 'block';
                    return;
                }
            } catch (_) {
                // Fallback offline se aberto diretamente sem servidor Node
                localStorage.setItem('username', username);
                localStorage.setItem('password', password);
                window.location.href = 'view/html/principal.html';
            }
        });
    </script>
</body>

</html>
